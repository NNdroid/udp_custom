name: Apply lock-free PortSelector

on:
  push:
    branches:
      - perf/throughput-pipeline

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/throughput-pipeline
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Benchmark current parallel selector
        shell: bash
        run: |
          cat > tunnel/portselector_parallel_bench_test.go <<'EOF'
          package tunnel

          import "testing"

          func BenchmarkPortSelectorRandomParallel(b *testing.B) {
          	sel := NewPortSelector(benchPortRange(b), SelectorRandom)
          	b.ReportAllocs()
          	b.RunParallel(func(pb *testing.PB) {
          		for pb.Next() {
          			_ = sel.Next()
          		}
          	})
          }
          EOF
          gofmt -w tunnel/portselector_parallel_bench_test.go
          go test -run '^$' -bench '^BenchmarkPortSelectorRandomParallel$' -benchmem -benchtime=2s -count=7 ./tunnel/ | tee /tmp/selector-base.txt

      - name: Replace mutex PRNG with atomic SplitMix64
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tunnel/portrange.go')
          s = p.read_text()
          s = s.replace('\t"math/rand"\n', '')
          s = s.replace('\t"sync"\n', '')

          old = '''type PortSelector struct {
          \tpr   *PortRange
          \tmode SelectorMode
          \trr   atomic.Uint64
          \trng  *rand.Rand
          \tmu   sync.Mutex
          }

          // NewPortSelector creates a selector over pr. The RNG seed is drawn from
          // crypto/rand so the random spread does not start from a predictable sequence.
          func NewPortSelector(pr *PortRange, mode SelectorMode) *PortSelector {
          \treturn &PortSelector{
          \t\tpr:   pr,
          \t\tmode: mode,
          \t\trng:  rand.New(rand.NewSource(randomSeed())),
          \t}
          }
          '''
          new = '''type PortSelector struct {
          \tpr       *PortRange
          \tmode     SelectorMode
          \trr       atomic.Uint64
          \trngState atomic.Uint64
          }

          // NewPortSelector creates a selector over pr. The PRNG state is seeded from
          // crypto/rand, but per-packet generation is deliberately lock-free: random
          // destination-port selection is traffic spreading, not a cryptographic use.
          func NewPortSelector(pr *PortRange, mode SelectorMode) *PortSelector {
          \ts := &PortSelector{pr: pr, mode: mode}
          \ts.rngState.Store(uint64(randomSeed()))
          \treturn s
          }

          // nextRandom advances a SplitMix64 stream with one atomic add. SplitMix64 is
          // fast, has excellent bit diffusion for port spreading, and unlike math/rand
          // behind a mutex does not serialize every packet from concurrent sessions.
          func (s *PortSelector) nextRandom() uint64 {
          \tz := s.rngState.Add(0x9e3779b97f4a7c15)
          \tz = (z ^ (z >> 30)) * 0xbf58476d1ce4e5b9
          \tz = (z ^ (z >> 27)) * 0x94d049bb133111eb
          \treturn z ^ (z >> 31)
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'PortSelector block mismatch: {s.count(old)}')
          s = s.replace(old, new)

          old = '''\ts.mu.Lock()
          \tidx := s.rng.Intn(s.pr.total)
          \ts.mu.Unlock()
          \treturn s.pr.PortAt(idx)
          '''
          new = '''\tidx := int(s.nextRandom() % uint64(s.pr.total))
          \treturn s.pr.PortAt(idx)
          '''
          if s.count(old) != 1:
              raise SystemExit(f'Next random block mismatch: {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY

          cat > tunnel/portselector_lockfree_test.go <<'EOF'
          package tunnel

          import (
          	"sync"
          	"testing"
          )

          func TestPortSelectorRandomConcurrentRange(t *testing.T) {
          	ports, err := ParsePortRangeSpec("25000-25499")
          	if err != nil {
          		t.Fatal(err)
          	}
          	pr, err := NewPortRange(ports)
          	if err != nil {
          		t.Fatal(err)
          	}
          	sel := NewPortSelector(pr, SelectorRandom)

          	const workers = 32
          	const iterations = 10000
          	var wg sync.WaitGroup
          	errCh := make(chan int, workers)
          	for i := 0; i < workers; i++ {
          		wg.Add(1)
          		go func() {
          			defer wg.Done()
          			for j := 0; j < iterations; j++ {
          				p := sel.Next()
          				if !pr.Contains(p) {
          					errCh <- p
          					return
          				}
          			}
          		}()
          	}
          	wg.Wait()
          	close(errCh)
          	if p, ok := <-errCh; ok {
          		t.Fatalf("selector returned port %d outside configured range", p)
          	}
          }

          func BenchmarkPortSelectorRandomParallel(b *testing.B) {
          	sel := NewPortSelector(benchPortRange(b), SelectorRandom)
          	b.ReportAllocs()
          	b.RunParallel(func(pb *testing.PB) {
          		for pb.Next() {
          			_ = sel.Next()
          		}
          	})
          }
          EOF
          rm tunnel/portselector_parallel_bench_test.go
          gofmt -w tunnel/portrange.go tunnel/portselector_lockfree_test.go

      - name: Focused tests
        run: go test -count=20 -run 'PortSelector|PortRange' ./tunnel/

      - name: Vet
        run: go vet ./...

      - name: Full tests
        run: go test -count=1 -timeout 15m ./...

      - name: Race tests
        run: go test -count=1 -race -timeout 20m ./...

      - name: Benchmark lock-free selector
        shell: bash
        run: |
          go test -run '^$' -bench '^BenchmarkPortSelectorRandomParallel$' -benchmem -benchtime=2s -count=7 ./tunnel/ | tee /tmp/selector-head.txt
          go run golang.org/x/perf/cmd/benchstat@latest /tmp/selector-base.txt /tmp/selector-head.txt | tee /tmp/selector-benchstat.txt
          cat /tmp/selector-benchstat.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Throughput smoke
        run: >-
          go test -run '^$'
          -bench 'Benchmark(TCP|UDP)Target_|BenchmarkPortSelector'
          -benchmem -benchtime=1s -count=1 -timeout 20m ./tunnel/

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-lockfree-portselector.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: make random port selection lock-free'
          git push origin HEAD:perf/throughput-pipeline
