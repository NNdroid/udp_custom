name: Test

# Runs the FULL suite (141 test/benchmark/fuzz-seed functions) on every push
# to main and every pull request. The race detector runs on ALL three
# platforms: Linux needs nothing extra; macOS has Apple Clang preinstalled;
# Windows needs a mingw-w64 gcc (installed via Chocolatey) because the race
# detector is a CGO feature. ubuntu-latest is additionally the only platform
# that executes origdst_test.go (linux build tag).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Test (linux, race)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -count=1 -race ./...

      - name: Test coverage summary
        run: go test -count=1 -cover ./... | grep -E "ok|FAIL"

  test-windows:
    name: Test (windows, race)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 (CGO backend for the race detector)
        run: choco install mingw -y --no-progress

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test with race detector
        run: go test -count=1 -race ./...

  test-macos:
    name: Test (macos, race)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test with race detector
        run: go test -count=1 -race ./...

  # 32-bit RUNTIME verification. Alignment bugs ("unaligned 64-bit atomic
  # operation") panic only when a 64-bit atomic op runs on a 32-bit CPU —
  # compiling or vetting for GOARCH=386/arm does NOT catch them (see commit
  # 5a8796c: the panic surfaced on real 32-bit ARM hardware). qemu-user via
  # binfmt executes the 386/arm test binaries on the amd64 runner; syscalls
  # (loopback UDP/TCP) pass straight through to the host kernel, so the
  # end-to-end network tests run unchanged.
  #
  # The race detector deliberately has NO 32-bit backend (verified: "-race is
  # not supported on linux/386") — TSan only ships for 64-bit targets. Race
  # coverage therefore comes from the 64-bit jobs above: data races are
  # scheduler-level bugs independent of word size, so the combination
  # "64-bit -race green + 32-bit plain run green" is the full coverage.
  # The value of THIS job is alignment + word-size + 32-bit-int coverage.
  test-linux-32bit:
    name: Test (linux, 386 + arm runtime)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install qemu-user (execute 32-bit test binaries)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Vet (386 + arm, compile-time check)
        run: |
          GOARCH=386 go vet ./...
          GOARCH=arm go vet ./...

      - name: Test 386 (runtime under qemu)
        run: GOARCH=386 go test -count=1 -timeout 20m ./...

      - name: Test arm (runtime under qemu)
        run: GOARCH=arm go test -count=1 -timeout 20m ./...

  # 32-bit benchmarks under qemu: word-size + alignment coverage of the same
  # hot-path suite the 64-bit benchmark jobs run. The numbers carry qemu
  # emulation overhead AND 32-bit word size, so they are NOT comparable with
  # the 64-bit runs — they exist for 32-bit-vs-32-bit regression tracking
  # across commits (benchstat on this artifact series) and to prove the bench
  # suite itself is 32-bit-safe. benchtime is halved (1s) because qemu roughly
  # triples wall time. CPU/mem pprof is skipped here: SIGPROF-based sampling
  # under qemu-user is unreliable and would produce misleading flamegraphs.
  benchmark-32bit:
    name: Benchmark (linux, 386 + arm)
    runs-on: ubuntu-latest
    # qemu timings are noisy; never block merges
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install qemu-user (execute 32-bit binaries)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Throughput benchmarks 386 (Target x protocol)
        run: >
          GOARCH=386 go test -run XXX
          -bench 'BenchmarkTCPTarget_|BenchmarkUDPTarget_'
          -benchmem -benchtime=1s
          ./tunnel/ | tee benchmark-32bit.txt

      - name: Micro benchmarks 386 (codec, AEAD, replay filter)
        run: >
          GOARCH=386 go test -run XXX
          -bench 'BenchmarkFrame|BenchmarkNoise|BenchmarkReplayFilter'
          -benchmem -benchtime=1s
          ./tunnel/ | tee -a benchmark-32bit.txt

      - name: Throughput benchmarks arm (Target x protocol)
        run: >
          GOARCH=arm go test -run XXX
          -bench 'BenchmarkTCPTarget_|BenchmarkUDPTarget_'
          -benchmem -benchtime=1s
          ./tunnel/ | tee benchmark-32bit-arm.txt

      - name: Micro benchmarks arm (codec, AEAD, replay filter)
        run: >
          GOARCH=arm go test -run XXX
          -bench 'BenchmarkFrame|BenchmarkNoise|BenchmarkReplayFilter'
          -benchmem -benchtime=1s
          ./tunnel/ | tee -a benchmark-32bit-arm.txt

      - name: Upload 32-bit benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-32bit-${{ github.sha }}
          path: |
            benchmark-32bit.txt
            benchmark-32bit-arm.txt
          retention-days: 30

  # Benchmarks run SEPARATELY from the merge gate: shared-runner timing noise
  # (±10-20%) makes hard ns/op thresholds a false-positive factory. These jobs
  # only prove the benchmarks execute and print the throughput numbers for
  # trend tracking; real regression detection compares distributions across
  # commits (e.g. benchstat) rather than gating on a single run.
  benchmark-linux:
    name: Benchmark (linux)
    runs-on: ubuntu-latest
    # never block merges on noisy timing
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install Graphviz (pprof flamegraph renderer)
        run: sudo apt-get install -y graphviz

      - name: Throughput benchmarks (Target x protocol)
        run: >
          go test -run XXX
          -bench 'BenchmarkTCPTarget_|BenchmarkUDPTarget_'
          -benchmem -benchtime=2s
          -cpuprofile cpu-throughput.prof
          ./tunnel/ | tee benchmark.txt

      - name: Micro benchmarks (codec, AEAD, replay filter)
        run: >
          go test -run XXX
          -bench 'BenchmarkFrame|BenchmarkNoise|BenchmarkReplayFilter'
          -benchmem -benchtime=2s
          -cpuprofile cpu.prof -memprofile mem.prof
          ./tunnel/ | tee -a benchmark.txt

      - name: Generate flamegraph SVGs
        if: always()
        run: |
          if [ -f cpu.prof ]; then
            go tool pprof -svg -output flamegraph-cpu.svg cpu.prof
          fi
          if [ -f mem.prof ]; then
            go tool pprof -svg -output flamegraph-mem.svg mem.prof
          fi
          if [ -f cpu-throughput.prof ]; then
            go tool pprof -svg -output flamegraph-throughput.svg cpu-throughput.prof
          fi

      - name: Upload benchmark & profiling artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-linux-${{ github.sha }}
          path: |
            benchmark.txt
            cpu.prof
            mem.prof
            cpu-throughput.prof
            flamegraph-cpu.svg
            flamegraph-mem.svg
            flamegraph-throughput.svg
          retention-days: 30

  benchmark-macos:
    name: Benchmark (macos)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install Graphviz (pprof flamegraph renderer)
        run: brew install graphviz

      - name: Throughput benchmarks (Target x protocol)
        run: >
          go test -run XXX
          -bench 'BenchmarkTCPTarget_|BenchmarkUDPTarget_'
          -benchmem -benchtime=2s
          -cpuprofile cpu-throughput.prof
          ./tunnel/ | tee benchmark.txt

      - name: Micro benchmarks (codec, AEAD, replay filter)
        run: >
          go test -run XXX
          -bench 'BenchmarkFrame|BenchmarkNoise|BenchmarkReplayFilter'
          -benchmem -benchtime=2s
          -cpuprofile cpu.prof -memprofile mem.prof
          ./tunnel/ | tee -a benchmark.txt

      - name: Generate flamegraph SVGs
        if: always()
        run: |
          if [ -f cpu.prof ]; then
            go tool pprof -svg -output flamegraph-cpu.svg cpu.prof
          fi
          if [ -f mem.prof ]; then
            go tool pprof -svg -output flamegraph-mem.svg mem.prof
          fi
          if [ -f cpu-throughput.prof ]; then
            go tool pprof -svg -output flamegraph-throughput.svg cpu-throughput.prof
          fi

      - name: Upload benchmark & profiling artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-macos-${{ github.sha }}
          path: |
            benchmark.txt
            cpu.prof
            mem.prof
            cpu-throughput.prof
            flamegraph-cpu.svg
            flamegraph-mem.svg
            flamegraph-throughput.svg
          retention-days: 30

  benchmark-windows:
    name: Benchmark (windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Graphviz (pprof flamegraph renderer)
        run: choco install graphviz -y --no-progress

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Throughput benchmarks (Target x protocol)
        run: >
          go test -run XXX
          -bench 'BenchmarkTCPTarget_|BenchmarkUDPTarget_'
          -benchmem -benchtime=2s
          -cpuprofile cpu-throughput.prof
          ./tunnel/ | tee benchmark.txt
        shell: bash

      - name: Micro benchmarks (codec, AEAD, replay filter)
        run: >
          go test -run XXX
          -bench 'BenchmarkFrame|BenchmarkNoise|BenchmarkReplayFilter'
          -benchmem -benchtime=2s
          -cpuprofile cpu.prof -memprofile mem.prof
          ./tunnel/ | tee -a benchmark.txt
        shell: bash

      - name: Generate flamegraph SVGs
        if: always()
        run: |
          if [ -f cpu.prof ]; then
            go tool pprof -svg -output flamegraph-cpu.svg cpu.prof
          fi
          if [ -f mem.prof ]; then
            go tool pprof -svg -output flamegraph-mem.svg mem.prof
          fi
          if [ -f cpu-throughput.prof ]; then
            go tool pprof -svg -output flamegraph-throughput.svg cpu-throughput.prof
          fi
        shell: bash

      - name: Upload benchmark & profiling artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-windows-${{ github.sha }}
          path: |
            benchmark.txt
            cpu.prof
            mem.prof
            cpu-throughput.prof
            flamegraph-cpu.svg
            flamegraph-mem.svg
            flamegraph-throughput.svg
          retention-days: 30
