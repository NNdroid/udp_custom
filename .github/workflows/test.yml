name: Test

# Runs the FULL suite (141 test/benchmark/fuzz-seed functions) on every push
# to main and every pull request. The race detector runs on ALL three
# platforms: Linux needs nothing extra; macOS has Apple Clang preinstalled;
# Windows needs a mingw-w64 gcc (installed via Chocolatey) because the race
# detector is a CGO feature. ubuntu-latest is additionally the only platform
# that executes origdst_test.go (linux build tag).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Test (linux, race)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -count=1 -race ./...

      - name: Test coverage summary
        run: go test -count=1 -cover ./... | grep -E "ok|FAIL"

  test-windows:
    name: Test (windows, race)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 (CGO backend for the race detector)
        run: choco install mingw -y --no-progress

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test with race detector
        run: go test -count=1 -race ./...

  test-macos:
    name: Test (macos, race)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test with race detector
        run: go test -count=1 -race ./...

  # Benchmarks run SEPARATELY from the merge gate: shared-runner timing noise
  # (±10-20%) makes hard ns/op thresholds a false-positive factory. This job
  # only proves the benchmarks execute and prints the throughput numbers for
  # trend tracking; real regression detection compares distributions across
  # commits (e.g. benchstat) rather than gating on a single run.
  benchmark-linux:
    name: Benchmark (linux)
    runs-on: ubuntu-latest
    # never block merges on noisy timing
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install Graphviz (pprof flamegraph renderer)
        run: sudo apt-get install -y graphviz

      - name: Throughput benchmarks (Target x protocol)
        run: >
          go test -run XXX
          -bench 'BenchmarkTCPTarget_|BenchmarkUDPTarget_'
          -benchmem -benchtime=2s
          -cpuprofile cpu-throughput.prof
          ./tunnel/ | tee benchmark.txt

      - name: Micro benchmarks (codec, AEAD, replay filter)
        run: >
          go test -run XXX
          -bench 'BenchmarkFrame|BenchmarkNoise|BenchmarkReplayFilter'
          -benchmem -benchtime=2s
          -cpuprofile cpu.prof -memprofile mem.prof
          ./tunnel/ | tee -a benchmark.txt

      - name: Generate flamegraph SVGs
        if: always()
        run: |
          if [ -f cpu.prof ]; then
            go tool pprof -svg -output flamegraph-cpu.svg cpu.prof
          fi
          if [ -f mem.prof ]; then
            go tool pprof -svg -output flamegraph-mem.svg mem.prof
          fi
          if [ -f cpu-throughput.prof ]; then
            go tool pprof -svg -output flamegraph-throughput.svg cpu-throughput.prof
          fi

      - name: Upload benchmark & profiling artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            benchmark.txt
            cpu.prof
            mem.prof
            cpu-throughput.prof
            flamegraph-cpu.svg
            flamegraph-mem.svg
            flamegraph-throughput.svg
          retention-days: 30
