name: Release

# Tag pushes publish a release. Manual runs generate the version automatically;
# publish_release controls whether to publish or only upload build artifacts.
on:
  push:
    tags:
      - 'v1.0.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Automatically create the version tag and publish a GitHub Release'
        type: boolean
        required: true
        default: true

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build raw binaries
    runs-on: ubuntu-latest
    env:
      APP_NAME: udp_custom

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and validate version
        id: version
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          short_sha="${target_sha:0:7}"
          commit_count="$(git rev-list --count HEAD)"
          derived="v1.0.$(date -u +%Y%m%d).${commit_count}-${short_sha}"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
            if ! [[ "${version}" =~ ^v1\.0\.[0-9]{8}\.${commit_count}-${short_sha}$ ]]; then
              echo "The pushed tag must contain this commit's count (${commit_count}) and hash (${short_sha})." >&2
              echo "Use Actions > Release > Run workflow with publish_release enabled to generate the tag automatically." >&2
              exit 1
            fi
            publish=true
          else
            version="${derived}"
            publish="${PUBLISH_RELEASE:-false}"
          fi

          # Re-runs may update the same release, but must never reuse a tag
          # belonging to another commit.
          if [ "${publish}" = "true" ] && git show-ref --verify --quiet "refs/tags/${version}"; then
            tagged_sha="$(git rev-parse "refs/tags/${version}^{commit}")"
            if [ "${tagged_sha}" != "${target_sha}" ]; then
              echo "Tag ${version} already belongs to another commit; refusing to overwrite it." >&2
              exit 1
            fi
          fi

          {
            echo "version=${version}"
            echo "target_sha=${target_sha}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "Version: ${version}"
            echo "Commit: ${target_sha}"
            echo "Publish Release: ${publish}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Building ${version} (publish=${publish})"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test -race ./...

      - name: Build raw binaries
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          platforms=(
            'linux/amd64'
            'linux/arm64'
            'linux/arm/v7'
            'linux/386'
            'darwin/amd64'
            'darwin/arm64'
            'windows/amd64'
            'windows/arm64'
            'windows/386'
          )

          for platform in "${platforms[@]}"; do
            IFS=/ read -r goos goarch goarm <<< "${platform}"
            binary_name="${APP_NAME}_${goos}_${goarch}"
            output="dist/${binary_name}"
            [ "${goos}" = 'windows' ] && output="${output}.exe"

            echo "Building ${platform} -> ${output}"
            if [ -n "${goarm:-}" ]; then
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" GOARM="${goarm#v}" \
                go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o "${output}" .
            else
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o "${output}" .
            fi
          done

      # GitHub bundles artifact downloads itself; this workflow never creates or
      # uploads a zip/tar file. Each listed item is a raw executable.
      - name: Upload manual build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.version.outputs.target_sha }}
          name: ${{ env.APP_NAME }} ${{ steps.version.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
