name: Release

# Pushing a tag v1.0.* creates a GitHub Release. The release version string is
# derived from git metadata (scripts/version.sh):
#   v1.0.yyyyMMdd.<commit-count>-<short-sha>
# so the same rule is used for local builds and CI. A manual run creates no
# Release; it uploads one Actions artifact instead.
on:
  push:
    tags:
      - 'v1.0.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build raw binaries
    runs-on: ubuntu-latest
    env:
      APP_NAME: udp_custom

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Auto-generate the version from git metadata (same rule as local builds).
          derived="$(bash "${GITHUB_WORKSPACE}/scripts/version.sh")"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # The pushed tag IS the release version; it must follow the rule
            # (v1.0.yyyyMMdd.<commit-count>-<7-char-sha>), i.e. what
            # "git tag $(scripts/version.sh)" produces.
            tag="${GITHUB_REF_NAME}"
            if ! [[ "${tag}" =~ ^v1\.0\.[0-9]{8}\.[0-9]+-[0-9a-f]{7}$ ]]; then
              echo "Tag must be v1.0.yyyyMMdd.<commit-count>-<7-char-sha>." >&2
              echo "Create it with:  git tag \$(scripts/version.sh) && git push --tags" >&2
              exit 1
            fi
            version="${tag}"
          else
            # Manual dispatch: use the git-derived version (no release is created).
            version="${derived}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building ${version}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test -race ./...

      - name: Build raw binaries
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          platforms=(
            'linux/amd64'
            'linux/arm64'
            'linux/arm/v7'
            'linux/386'
            'darwin/amd64'
            'darwin/arm64'
            'windows/amd64'
            'windows/arm64'
            'windows/386'
          )

          for platform in "${platforms[@]}"; do
            IFS=/ read -r goos goarch goarm <<< "${platform}"
            binary_name="${APP_NAME}_${goos}_${goarch}"
            output="dist/${binary_name}"
            [ "${goos}" = 'windows' ] && output="${output}.exe"

            echo "Building ${platform} -> ${output}"
            if [ -n "${goarm:-}" ]; then
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" GOARM="${goarm#v}" \
                go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o "${output}" .
            else
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o "${output}" .
            fi
          done

      # GitHub bundles artifact downloads itself; this workflow never creates or
      # uploads a zip/tar file. Each listed item is a raw executable.
      - name: Upload manual build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
