name: Revert regressing PortSelector change

on:
  push:
    branches:
      - perf/throughput-pipeline

permissions:
  contents: write

jobs:
  revert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/throughput-pipeline
          fetch-depth: 0
      - name: Revert performance regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit c4b3aa4
          git rm .github/workflows/revert-lockfree-portselector.yml
          git commit --amend --no-edit
          git push origin HEAD:perf/throughput-pipeline
